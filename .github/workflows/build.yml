name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests

      - name: Build EXE
        run: |
          cd client
          pyinstaller --onefile --name MLX-Log-Collector collector.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLX-Log-Collector
          path: client/dist/MLX-Log-Collector.exe

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MLX Log Collector v${{ github.run_number }}
          files: client/dist/MLX-Log-Collector.exe
          generate_release_notes: false
          body: |
            MLX Log Collector - auto-built from latest code.

            Download MLX-Log-Collector.exe and run it on any VA machine.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
